name: 💡 Feature Idea
description: "Suggest a new capability."
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        _Hi there :wave: and thanks for taking the time to send a feature idea!_

        _Keep it terse — Problem, Outcome, and how we'd know it's done._

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's wrong or missing, and for whom? 1–2 sentences.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What does "done" look like? Describe observable behaviour, not the implementation.
    validations:
      required: true

  - type: textarea
    id: usage-example
    attributes:
      label: Usage Example
      description: How would the proposed feature be used?

  - type: textarea
    id: alternative
    attributes:
      label: Alternative
      description: What do you do today instead?

  - type: dropdown
    id: pull-request
    attributes:
      label: Could you help with a pull-request?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
